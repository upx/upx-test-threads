# BS BuildSystem: build on Windows with 'cmake -G "Ninja Multi-Config"'

name: 'Weekly CI BS - cmake Windows Ninja-Multi'
on:
  schedule: [cron: '30 1 * * 3'] # run weekly Wednesday 01:30 UTC
  workflow_dispatch:
env:
  CMAKE_REQUIRED_QUIET: 'OFF'
  CMAKE_VERBOSE_MAKEFILE: 'ON'
  CTEST_OUTPUT_ON_FAILURE: 'ON'
  DEBIAN_FRONTEND: noninteractive
  UPX_CMAKE_CONFIG_FLAGS: -Wdev --warn-uninitialized # via run_cmake_config.sh
  UPX_DEBUG_TEST_FLOAT_DIVISION_BY_ZERO: 1
  UPX_DEBUG_TEST_LIBC_QSORT: 1
  ZSTD_CLEVEL: 17

jobs:
  job-cmake-windows-ninja-multi: # uses cmake + ninja-multi
    if: github.repository_owner == 'upx'
    strategy:
      fail-fast: false
      matrix:
        include:
          # cl (MSVC)
          # { os: windows-2019, cc: cl, cxx: cl, vsversion: 2019, vsarch: amd64 }
          # { os: windows-2019, cc: cl, cxx: cl, vsversion: 2019, vsarch: amd64_arm64 }
          # { os: windows-2019, cc: cl, cxx: cl, vsversion: 2019, vsarch: amd64_x86 }
          - { os: windows-2022, cc: cl, cxx: cl, vsversion: 2022, vsarch: amd64 }
          - { os: windows-2022, cc: cl, cxx: cl, vsversion: 2022, vsarch: amd64_arm64 }
          - { os: windows-2022, cc: cl, cxx: cl, vsversion: 2022, vsarch: amd64_x86 }
          - { os: windows-2025, cc: cl, cxx: cl, vsversion: 2022, vsarch: amd64 }
          - { os: windows-2025, cc: cl, cxx: cl, vsversion: 2022, vsarch: amd64_arm64 }
          - { os: windows-2025, cc: cl, cxx: cl, vsversion: 2022, vsarch: amd64_x86 }
          # clang-cl
          # { os: windows-2019, cc: clang-cl, cxx: clang-cl, vsversion: 2019, vsarch: amd64 }
          - { os: windows-2022, cc: clang-cl, cxx: clang-cl, vsversion: 2022, vsarch: amd64 }
          - { os: windows-2025, cc: clang-cl, cxx: clang-cl, vsversion: 2022, vsarch: amd64 }
          # clang
          # { os: windows-2019, cc: clang, cxx: 'clang++', vsarch: amd64, xflags: '-static' }
          - { os: windows-2022, cc: clang, cxx: 'clang++', vsarch: amd64, xflags: '-static' }
          - { os: windows-2025, cc: clang, cxx: 'clang++', vsarch: amd64, xflags: '-static' }
          # gcc (mingw-gcc)
          # { os: windows-2019, cc: gcc, cxx: 'g++', vsarch: amd64, xflags: '-static' }
          - { os: windows-2022, cc: gcc, cxx: 'g++', vsarch: amd64, xflags: '-static' }
          - { os: windows-2025, cc: gcc, cxx: 'g++', vsarch: amd64, xflags: '-static' }
    env:
      CC: ${{ matrix.cc }} ${{ matrix.xflags }}
      CXX: ${{ matrix.cxx }} ${{ matrix.xflags }}
    name: ${{ format('{0} {1} {2} {3}', matrix.cc, matrix.vsversion, matrix.vsarch, matrix.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - name: 'Check out code'
        uses: actions/checkout@v6
        with: { submodules: true }
      - name: 'Set up Developer Command Prompt'
        if: matrix.vsversion
        uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: ${{ matrix.vsversion }}
          arch: ${{ matrix.vsarch }}
      - name: 'Init environment'
        shell: bash
        run: |
          command -v ninja >/dev/null || choco install -y --no-progress ninja
          subdir=$(echo "${{ matrix.os }}-ninja-multi-${{ matrix.cc }}-${{ matrix.vsversion }}-${{ matrix.vsarch}}" | sed 's/[^0-9a-zA-Z_.-]/-/g')
          echo "subdir=$subdir" >> $GITHUB_ENV

      - { name: 'Config cmake Ninja',        run: 'bash -x ./misc/scripts/run_cmake_config.sh -S . -B build/$Env:subdir -G "Ninja Multi-Config"' }
      - { name: 'Build cmake Ninja default', run: 'cmake --build build/$Env:subdir --parallel --verbose' }
      - { name: 'Build cmake Ninja Debug',   run: 'cmake --build build/$Env:subdir --parallel --verbose --config Debug' }
      - { name: 'Build cmake Ninja Release', run: 'cmake --build build/$Env:subdir --parallel --verbose --config Release' }

      - name: 'Make artifact'
        shell: bash
        run: |
          N=$(echo "upx-${GITHUB_REF_NAME}-${GITHUB_SHA:0:7}-weekly-ci-${subdir}" | sed 's/[^0-9a-zA-Z_.-]/-/g')
          mkdir -p "tmp/artifact/$N"
          DESTDIR="$PWD/tmp/artifact/$N/InstallWithCMake/InstallWithDestdir/debug"           cmake --install build/$subdir --config Debug
          DESTDIR="$PWD/tmp/artifact/$N/InstallWithCMake/InstallWithDestdir/release"         cmake --install build/$subdir --config Release
          DESTDIR="$PWD/tmp/artifact/$N/InstallWithCMake/InstallWithDestdir/debug"           cmake --install build/$subdir --config Debug   --prefix /temp/local/upx
          DESTDIR="$PWD/tmp/artifact/$N/InstallWithCMake/InstallWithDestdir/release"         cmake --install build/$subdir --config Release --prefix /temp/local/upx
          DESTDIR="$PWD/tmp/artifact/$N/InstallWithCMake/InstallWithDestdirAndStrip/debug"   cmake --install build/$subdir --config Debug   --strip
          DESTDIR="$PWD/tmp/artifact/$N/InstallWithCMake/InstallWithDestdirAndStrip/release" cmake --install build/$subdir --config Release --strip
          DESTDIR="$PWD/tmp/artifact/$N/InstallWithCMake/InstallWithDestdirAndStrip/debug"   cmake --install build/$subdir --config Debug   --strip --prefix /temp/local/upx
          DESTDIR="$PWD/tmp/artifact/$N/InstallWithCMake/InstallWithDestdirAndStrip/release" cmake --install build/$subdir --config Release --strip --prefix /temp/local/upx
          cmake --install build/$subdir --config Debug   --prefix "$PWD/tmp/artifact/$N/InstallWithCMake/InstallWithPrefix/debug"
          cmake --install build/$subdir --config Release --prefix "$PWD/tmp/artifact/$N/InstallWithCMake/InstallWithPrefix/release"
          cmake --install build/$subdir --config Debug   --prefix "$PWD/tmp/artifact/$N/InstallWithCMake/InstallWithPrefixAndStrip/debug"   --strip
          cmake --install build/$subdir --config Release --prefix "$PWD/tmp/artifact/$N/InstallWithCMake/InstallWithPrefixAndStrip/release" --strip
          (cd build && cp -ai --parents */*/upx.exe "../tmp/artifact/$N")
          (cd tmp/artifact && tar --sort=name --zstd -cf "$N.tar.zst" "$N" && rm -rf "./$N" && ls -la)
          echo "artifact_name=$N" >> $GITHUB_ENV
      - name: ${{ format('Upload artifact {0}', env.artifact_name) }}
        uses: actions/upload-artifact@v6
        with: { name: '${{ env.artifact_name }}', path: tmp/artifact }

      - name: Run ctest tests
        if: ${{ matrix.vsarch != 'amd64_arm64' }}
        shell: bash
        run: |
          ./build/$subdir/Debug/upx.exe --sysinfo -v
          ./build/$subdir/Release/upx.exe --sysinfo -v
          ctest --test-dir build/$subdir --parallel ${CTEST_JOBS:-8} -C Debug
          ctest --test-dir build/$subdir --parallel ${CTEST_JOBS:-8} -C Release
      - name: 'Run install tests'
        shell: bash
        run: |
          env DESTDIR=./Install-default cmake --install build/$subdir
          env DESTDIR=./Install-debug   cmake --install build/$subdir --config Debug
          env DESTDIR=./Install-release cmake --install build/$subdir --config Release
