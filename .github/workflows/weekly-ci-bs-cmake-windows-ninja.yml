# BS BuildSystem: build on Windows with 'cmake -G Ninja'

name: 'Weekly CI BS - cmake Windows Ninja'
on:
  schedule: [cron: '30 1 * * 3'] # run weekly Wednesday 01:30 UTC
  workflow_dispatch:
env:
  CMAKE_REQUIRED_QUIET: 'OFF'
  CMAKE_VERBOSE_MAKEFILE: 'ON'
  CTEST_OUTPUT_ON_FAILURE: 'ON'
  DEBIAN_FRONTEND: noninteractive
  UPX_CMAKE_BUILD_FLAGS: --verbose
  UPX_CMAKE_CONFIG_FLAGS: -G Ninja -Wdev --warn-uninitialized
  ZSTD_CLEVEL: 17

jobs:
  job-cmake-windows-ninja: # uses cmake + ninja
    if: github.repository_owner == 'upx'
    strategy:
      fail-fast: false
      matrix:
        include:
          # cl (MSVC)
          # { os: windows-2019, cc: cl, cxx: cl, vsversion: 2019, vsarch: amd64 }
          # { os: windows-2019, cc: cl, cxx: cl, vsversion: 2019, vsarch: amd64_arm64 }
          # { os: windows-2019, cc: cl, cxx: cl, vsversion: 2019, vsarch: amd64_x86 }
          - { os: windows-2022, cc: cl, cxx: cl, vsversion: 2022, vsarch: amd64 }
          - { os: windows-2022, cc: cl, cxx: cl, vsversion: 2022, vsarch: amd64_arm64 }
          - { os: windows-2022, cc: cl, cxx: cl, vsversion: 2022, vsarch: amd64_x86 }
          - { os: windows-2025, cc: cl, cxx: cl, vsversion: 2022, vsarch: amd64 }
          - { os: windows-2025, cc: cl, cxx: cl, vsversion: 2022, vsarch: amd64_arm64 }
          - { os: windows-2025, cc: cl, cxx: cl, vsversion: 2022, vsarch: amd64_x86 }
          # clang-cl
          # { os: windows-2019, cc: clang-cl, cxx: clang-cl, vsversion: 2019, vsarch: amd64 }
          - { os: windows-2022, cc: clang-cl, cxx: clang-cl, vsversion: 2022, vsarch: amd64 }
          - { os: windows-2025, cc: clang-cl, cxx: clang-cl, vsversion: 2022, vsarch: amd64 }
          # clang
          # { os: windows-2019, cc: clang, cxx: 'clang++', vsarch: amd64, xflags: '-static' }
          - { os: windows-2022, cc: clang, cxx: 'clang++', vsarch: amd64, xflags: '-static' }
          - { os: windows-2025, cc: clang, cxx: 'clang++', vsarch: amd64, xflags: '-static' }
          # gcc (mingw-gcc)
          # { os: windows-2019, cc: gcc, cxx: 'g++', vsarch: amd64, xflags: '-static' }
          - { os: windows-2022, cc: gcc, cxx: 'g++', vsarch: amd64, xflags: '-static' }
          - { os: windows-2025, cc: gcc, cxx: 'g++', vsarch: amd64, xflags: '-static' }
    env:
      CC: ${{ matrix.cc }} ${{ matrix.xflags }}
      CXX: ${{ matrix.cxx }} ${{ matrix.xflags }}
    name: ${{ format('{0} {1} {2} {3}', matrix.cc, matrix.vsversion, matrix.vsarch, matrix.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - name: 'Check out code'
        uses: actions/checkout@v6
        with: { submodules: true }
      - name: 'Set up Developer Command Prompt'
        if: matrix.vsversion
        uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: ${{ matrix.vsversion }}
          arch: ${{ matrix.vsarch }}
      - name: 'Init environment'
        shell: bash
        run: |
          command -v ninja >/dev/null || choco install -y --no-progress ninja
          xtarget=$(echo "${{ matrix.os }}-ninja-${{ matrix.cc }}-${{ matrix.vsversion }}-${{ matrix.vsarch}}" | sed 's/[^0-9a-zA-Z_.-]/-/g')
          echo "xtarget=$xtarget" >> $GITHUB_ENV
      - name: 'Build cmake Ninja Debug'
        shell: bash
        run: |
          make UPX_XTARGET=xtarget/$xtarget xtarget/debug
          ls -l build/xtarget/$xtarget/debug/upx.exe
          file  build/xtarget/$xtarget/debug/upx.exe || true
      - name: 'Build cmake Ninja Release'
        if: success() || failure() # run this step even if the previous step failed
        shell: bash
        run: |
          make UPX_XTARGET=xtarget/$xtarget xtarget/release
          ls -l build/xtarget/$xtarget/release/upx.exe
          file  build/xtarget/$xtarget/release/upx.exe || true

      - name: 'Make artifact'
        shell: bash
        run: |
          N=$(echo "upx-${GITHUB_REF_NAME}-${GITHUB_SHA:0:7}-weekly-ci-ninja-${xtarget}" | sed 's/[^0-9a-zA-Z_.-]/-/g')
          mkdir -p "tmp/artifact/$N"
          dirs="$xtarget/debug $xtarget/release"
          for d in $dirs; do DESTDIR="$PWD/tmp/artifact/$N/InstallWithCMake/InstallWithDestdir/$d"         cmake --install build/xtarget/$d; done
          for d in $dirs; do DESTDIR="$PWD/tmp/artifact/$N/InstallWithCMake/InstallWithDestdir/$d"         cmake --install build/xtarget/$d --prefix /temp/local/upx; done
          for d in $dirs; do DESTDIR="$PWD/tmp/artifact/$N/InstallWithCMake/InstallWithDestdirAndStrip/$d" cmake --install build/xtarget/$d --strip; done
          for d in $dirs; do DESTDIR="$PWD/tmp/artifact/$N/InstallWithCMake/InstallWithDestdirAndStrip/$d" cmake --install build/xtarget/$d --strip --prefix /temp/local/upx; done
          for d in $dirs; do cmake --install build/xtarget/$d --prefix "$PWD/tmp/artifact/$N/InstallWithCMake/InstallWithPrefix/$d"; done
          for d in $dirs; do cmake --install build/xtarget/$d --prefix "$PWD/tmp/artifact/$N/InstallWithCMake/InstallWithPrefixAndStrip/$d" --strip; done
          (cd build && cp -ai --parents xtarget/*/*/upx.exe "../tmp/artifact/$N")
          (cd tmp/artifact && tar --sort=name --zstd -cf "$N.tar.zst" "$N" && rm -rf "./$N" && ls -la)
          echo "artifact_name=$N" >> $GITHUB_ENV
      - name: ${{ format('Upload artifact {0}', env.artifact_name) }}
        uses: actions/upload-artifact@v6
        with: { name: '${{ env.artifact_name }}', path: tmp/artifact }

      - name: 'Run ctest tests'
        if: ${{ matrix.vsarch != 'amd64_arm64' }}
        shell: bash
        run: |
          ./build/xtarget/$xtarget/debug/upx.exe --sysinfo -v
          ./build/xtarget/$xtarget/release/upx.exe --sysinfo -v
          ctest --test-dir build/xtarget/$xtarget/debug   --parallel 8
          ctest --test-dir build/xtarget/$xtarget/release --parallel 8
      - name: 'Run install tests'
        shell: bash
        run: |
          env DESTDIR=./Install-debug   cmake --install build/xtarget/$xtarget/debug
          env DESTDIR=./Install-release cmake --install build/xtarget/$xtarget/release
