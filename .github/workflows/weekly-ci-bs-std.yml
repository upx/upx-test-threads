# BS BuildSystem: build with -std=XXX flags

name: Weekly CI BS - std C++
on:
  schedule: [cron: '55 1 * * 3'] # run weekly Wednesday 01:55 UTC
  workflow_dispatch:
env:
  CMAKE_REQUIRED_QUIET: 'OFF'
  CMAKE_VERBOSE_MAKEFILE: 'ON'
  CTEST_OUTPUT_ON_FAILURE: 'ON'
  DEBIAN_FRONTEND: noninteractive
  UPX_CONFIG_EXPECT_THREADS: 'ON'
  UPX_CMAKE_BUILD_FLAGS: --verbose
  UPX_DEBUG_TEST_FLOAT_DIVISION_BY_ZERO: 1
  UPX_DEBUG_TEST_LIBC_QSORT: 1
  # std=XXX
  UPX_CONFIG_DISABLE_C_STANDARD: 'ON'
  UPX_CONFIG_DISABLE_CXX_STANDARD: 'ON'

jobs:
  # test various clang/gcc -std=gnu++XX versions
  cc: # uses cmake + make
    if: github.repository_owner == 'upx'
    strategy:
      fail-fast: false
      matrix:
        include:
          # C++20
          - cxx:       clang++-15 -std=gnu++20
            cc:        clang-15 -std=gnu17
            container: alpine:3.20
            packages:  clang15 musl-dev # clang15: missing dependency on musl-dev
          - cxx:       clang++-16 -std=gnu++20
            cc:        clang-16 -std=gnu17
            container: alpine:3.20
            packages:  clang16
          - cxx:       clang++-17 -std=gnu++20
            cc:        clang-17 -std=gnu17
            container: alpine:3.20
            packages:  clang17
            xflags:    -flto=auto
          - cxx:       clang++-18 -std=gnu++20
            cc:        clang-18 -std=gnu17
            container: alpine:3.20
            packages:  clang18
          - cxx:       g++ -std=gnu++20
            cc:        gcc -std=gnu17
            container: alpine:3.20
            packages:  g++
            xflags:    -flto=auto
          # C++23
          - cxx:       clang++-17 -std=gnu++23
            cc:        clang-17 -std=gnu2x -Wno-constant-logical-operand
            container: alpine:3.20
            packages:  clang17
          - cxx:       clang++-18 -std=gnu++23
            cc:        clang-18 -std=gnu23
            container: alpine:3.20
            packages:  clang18
          - cxx:       g++ -std=gnu++23
            cc:        gcc -std=gnu2x
            container: alpine:3.20
            packages:  g++
          # C++26 (TODO later: need gcc-14)
#         - cxx:       g++ -std=gnu++26
#           cc:        gcc -std=gnu23
#           container: alpine:edge
#           packages:  g++
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    name: ${{ format('{0}', matrix.cxx) }}
    env:
      CC: ${{ matrix.cc }} ${{ matrix.xflags }}
      CXX: ${{ matrix.cxx }} ${{ matrix.xflags }}
    steps:
      - name: ${{ format('Install packages {0}', matrix.container) }}
        run: apk update && apk upgrade && apk add cmake file git make ${{ matrix.packages }}
      - name: ${{ format('Check out {0} source code', github.ref_name) }}
        run: |
          git config --global --add safe.directory '*'
          git clone --branch "$GITHUB_REF_NAME" --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" .
          git submodule update --init
      - run: set -x; $CC --version; $CXX --version
      - run: $CC  -E -x c   -dM /dev/null
      - run: $CXX -E -x c++ -dM /dev/null
      - run: make build/debug
      - run: make build/release
      - run: build/debug/upx --sysinfo -v
      - run: build/release/upx --sysinfo -v
      - run: make build/debug+test
      - run: make build/release+test
      - name: Show summary
        run: ls -l build/*/upx && size build/*/upx && file build/*/upx

  # test various MSVC -std:c++XX versions
  msvc: # uses cmake + msbuild
    if: github.repository_owner == 'upx'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2019, vsversion: 2019, vsarch: amd64, cflags: '-std:c11', cxxflags: '-std:c++17' }
          - { os: windows-2019, vsversion: 2019, vsarch: amd64, cflags: '-std:c17', cxxflags: '-std:c++20' }
          - { os: windows-2019, vsversion: 2019, vsarch: amd64, cflags: '-std:clatest', cxxflags: '-std:c++latest' }
          - { os: windows-2022, vsversion: 2022, vsarch: amd64, cflags: '-std:c11', cxxflags: '-std:c++17' }
          - { os: windows-2022, vsversion: 2022, vsarch: amd64, cflags: '-std:c17', cxxflags: '-std:c++20' }
          - { os: windows-2022, vsversion: 2022, vsarch: amd64, cflags: '-std:clatest', cxxflags: '-std:c++latest' }
    runs-on: ${{ matrix.os }}
    ##name: ${{ format('{0} {1} {2} {3} {4}', matrix.os, matrix.vsversion, matrix.vsarch, matrix.cflags, matrix.cxxflags) }}
    name: ${{ format('{0} {1} {2}', matrix.os, matrix.cflags, matrix.cxxflags) }}
    env:
      CFLAGS: ${{ matrix.cflags }}
      CXXFLAGS: ${{ matrix.cxxflags }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: ilammy/msvc-dev-cmd@v1
        with: { vsversion: '${{ matrix.vsversion }}', arch: '${{ matrix.vsarch }}' }
      - run: make build/debug
      - run: make build/release
      - run: build\debug\Debug\upx.exe --sysinfo -v
        if: ${{ matrix.vsarch != 'amd64_arm64' }}
      - run: build\release\Release\upx.exe --sysinfo -v
        if: ${{ matrix.vsarch != 'amd64_arm64' }}
      - run: make build/debug+test
        if: ${{ matrix.vsarch != 'amd64_arm64' }}
      - run: make build/release+test
        if: ${{ matrix.vsarch != 'amd64_arm64' }}
      - name: Show summary
        shell: bash
        run: |
          ls -l build/*/*/upx.exe
          size build/*/*/upx.exe || true
          file build/*/*/upx.exe || true
